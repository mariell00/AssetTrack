<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AssetTrack</title>
  <link rel="icon" href="/assets/icons/icon.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <section id="login" class="stage" hidden>
    <form id="login-form" class="lg-card" autocomplete="on">
      <img src="/assets/brand/nbsc-wordmark.png" alt="Northern Bukidnon State College" class="lg-logo">
      <h1>AssetTrack</h1>
      <p class="lg-sub">Admin web app. Sign in to continue.</p>
      <label>User name <input class="retro-input" name="username" autocomplete="username" required></label>
      <label>Password <input class="retro-input" name="password" type="password" autocomplete="current-password" required></label>
      <p id="login-error" class="form-error" role="alert"></p>
      <button class="btn-retro full-width" type="submit">Log in</button>
      <p class="lg-note">The super admin signs in to the desktop app only.</p>
    </form>
  </section>

  <div id="shell" hidden>
    <header id="app-header">
      <div class="hd-logo"><img src="/assets/brand/nbsc-wordmark.png" alt="Northern Bukidnon State College"></div>
      <div class="hd-title"><h1 class="hd-brand">AssetTrack</h1><p class="hd-page" id="page-title">Dashboard</p></div>
      <div class="hd-clock"><span class="hd-time" id="top-time"></span><span class="hd-date" id="top-date"></span></div>
      <button type="button" id="btn-menu" class="hd-menu" aria-label="Open menu" aria-expanded="false" aria-controls="menu-drawer"><span></span><span></span><span></span></button>
    </header>
    <main id="view"></main>
  </div>

  <div id="menu-scrim" hidden></div>
  <aside id="menu-drawer" aria-label="Main menu" hidden>
    <div class="dr-bar"><span class="dr-code">Menu</span><button type="button" id="btn-menu-close" class="dr-x" aria-label="Close menu">&times;</button></div>
    <nav id="nav-links">
      <a href="#dashboard" data-nav="dashboard"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg></span>Dashboard</a>
      <a href="#assets" data-nav="assets"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg></span>Asset registry</a>
      <a href="#locations" data-nav="locations"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M10 21v-4h4v4"/></svg></span>Locations</a>
      <a href="#reports" data-nav="reports"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg></span>Reports</a>
      <a href="#assignees" data-nav="assignees"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 20a6.5 6.5 0 0 0-3-5.5"/></svg></span>Assignees</a>
    </nav>
    <div class="dr-foot">
      <div class="user-card"><span class="user-avatar" id="avatar">AD</span><div class="user-meta"><span class="user-name" id="who">Admin</span><span class="user-role">Admin</span></div></div>
      <div class="dr-status"><span><span class="status-dot" id="dot"></span><span id="srv">Checking…</span></span><span id="host"></span></div>
      <button id="logout" class="btn-retro full-width">Log out</button>
    </div>
  </aside>

  <dialog id="dlg" class="modal-box"><div id="dlg-body"></div><div class="dlg-foot"><button class="btn-retro outline small" id="dlg-close">Close</button></div></dialog>
  <script src="app.js"></script>
</body>
</html>
